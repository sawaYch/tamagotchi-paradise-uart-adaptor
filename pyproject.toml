[project]
name = "tamagotchi-paradise-adaptor"
version = "0.1.0"
description = "Parametric Tamagotchi Paradise UART adaptor models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "build123d",
    "ocp-vscode>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptor"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
